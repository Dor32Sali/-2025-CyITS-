version: "3.9"

services:
  intersection_i1:
    build:
      context: ./intersection
    container_name: intersection_i1
    environment:
      INTERSECTION_ID: "I1"
      BLOCK_ID: "BLOCK_A"
    networks:
      - citynet

  intersection_i2:
    build:
      context: ./intersection
    container_name: intersection_i2
    environment:
      INTERSECTION_ID: "I2"
      BLOCK_ID: "BLOCK_A"
    networks:
      - citynet

  block_a:
    build:
      context: ./block_controller
    container_name: block_a
    depends_on:
      - intersection_i1
      - intersection_i2
    environment:
      BLOCK_ID: "BLOCK_A"
      # Use the service names + ports inside the Docker network
      INTERSECTION_URLS: "http://intersection_i1:8000,http://intersection_i2:8000"
    networks:
      - citynet

  city_brain:
    build:
      context: ./city_brain
    container_name: city_brain
    depends_on:
      - block_a
    environment:
      BLOCK_URLS: "http://block_a:8001"
    ports:
      - "8002:8002"  # expose city_brain to your host so you can test easily
    networks:
      - citynet

networks:
  citynet:
    driver: bridge
